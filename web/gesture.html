<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture Guesser</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  .g-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.12fr 1fr; gap: 28px; padding: 22px 26px 12px; }
  .stage { position: relative; overflow: hidden; background: #000; border-radius: 16px; min-height: 0; }
  .stage canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  .stage-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: #fff; font-size: clamp(22px, 2.4vw, 36px); font-weight: 650; padding: 40px;
    background: rgba(0,0,0,.45); pointer-events: none;
  }
  .stage-stats { position: absolute; left: 12px; bottom: 10px; color: rgba(255,255,255,.75); font-size: 14px; font-family: var(--mono); text-shadow: 0 1px 2px #000; }
  .pick {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0;
    background: var(--panel); color: var(--ink); border-radius: 18px; padding: 22px 40px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.4); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .pick.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .pick .k { font-size: 20px; color: var(--muted); }
  .pick .v { font-size: clamp(36px, 4.2vw, 64px); font-weight: 800; color: var(--accent); line-height: 1.1; }
  .pick .p { font-size: 22px; color: var(--muted); }

  .g-side { display: flex; flex-direction: column; min-height: 0; }
  .g-question { margin: 0 0 4px; font-size: clamp(26px, 2.6vw, 42px); line-height: 1.15; font-weight: 750; }
  .g-model { color: var(--muted); font-size: 16px; margin-bottom: 14px; min-height: 1.4em; }
  .g-side .bars { flex: 1; min-height: 200px; --label-w: 7.6em; --pct-w: 3.4em; }
  .bars-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 22px; padding: 30px; }
  .numbers { margin-top: 12px; display: grid; gap: 10px; }
  .numbers .flow { font-size: 17px; color: var(--muted); }
  .numbers .flow b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .numbers .code { font-size: clamp(13px, 1.05vw, 17px); }
  .g-controls { flex: none; display: grid; grid-template-columns: 1fr auto auto; gap: 24px; align-items: center; padding: 10px 26px 18px; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    .g-main { grid-template-columns: 1fr; }
    .stage { aspect-ratio: 16/9; }
    .g-controls { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="g-main">
  <section class="stage">
    <canvas id="cam" width="1280" height="720"></canvas>
    <div class="stage-msg" id="msg">Starting camera…</div>
    <div class="stage-stats" id="stats"></div>
    <div class="pick" id="pick"><div class="k">The model picked</div><div class="v" id="pickV"></div><div class="p" id="pickP"></div></div>
  </section>
  <section class="g-side">
    <h1 class="g-question">What does the model think you're doing?</h1>
    <div class="g-model" id="modelInfo"></div>
    <div class="bars" id="bars"><div class="bars-empty hidden" id="barsEmpty"></div></div>
    <div class="numbers hidden" id="numbers">
      <div class="flow" id="flow"></div>
      <pre class="code" id="code"></pre>
    </div>
  </section>
</main>
<footer class="g-controls">
  <div class="temp" id="temp"></div>
  <button class="btn primary" id="sampleBtn">Sample a guess <kbd>Space</kbd></button>
  <button class="btn" id="numbersBtn">Show the numbers <kbd>N</kbd></button>
</footer>
<script src="/static/common.js"></script>
<script src="/static/gesture.js"></script>
</body>
</html>
